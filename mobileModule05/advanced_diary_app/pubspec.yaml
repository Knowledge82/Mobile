name: advanced_diary_app
description: "Diary with profile statistics and a calendar agenda (Piscine Mobile, module 05)."
# Не публикуем на pub.dev случайно.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # Firebase: ядро (инициализация), вход (Google и GitHub), база (Firestore).
  # firebase_options.dart создаёт `flutterfire configure` (см. docs/04-ex00.md).
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/leaves.jpg
